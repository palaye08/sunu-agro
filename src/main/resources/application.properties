spring.application.name=sunu-agro
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Base de données PostgreSQL (Neon)
# Les variables d'environnement DB_URL / DB_USERNAME / DB_PASSWORD
# sont prioritaires si elles sont définies.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-wandering-sea-b50pj4sd-pooler.c-7.us-east-2.aws.neon.tech/sunuAgro_db?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_L2ySkjc4mdxV}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool adapté au pooler Neon (offre gratuite, compute qui s'endort)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# API / OpenAPI
# ---------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB

# ---------------------------------------------------------------
# Règles de la coopérative (valeurs de référence modifiables)
# ---------------------------------------------------------------
sunuagri.cooperative.superficie-max-par-producteur-ha=50
sunuagri.cooperative.quantite-min-commande-kg=50
sunuagri.cooperative.taux-commission=0.05
sunuagri.cooperative.ecart-prix-avertissement=0.30

# Paramètres initiaux des cultures (chargés en base au premier démarrage,
# ensuite modifiables par l'administrateur via l'API)
sunuagri.cultures.ARACHIDE.rendement-reference-kg-ha=1200
sunuagri.cultures.ARACHIDE.humidite-max-pourcent=9
sunuagri.cultures.ARACHIDE.cycle-minimal-jours=90
sunuagri.cultures.MIL.rendement-reference-kg-ha=800
sunuagri.cultures.MIL.humidite-max-pourcent=12
sunuagri.cultures.MIL.cycle-minimal-jours=75
sunuagri.cultures.RIZ.rendement-reference-kg-ha=4000
sunuagri.cultures.RIZ.humidite-max-pourcent=14
sunuagri.cultures.RIZ.cycle-minimal-jours=110
sunuagri.cultures.MAIS.rendement-reference-kg-ha=2500
sunuagri.cultures.MAIS.humidite-max-pourcent=14
sunuagri.cultures.MAIS.cycle-minimal-jours=90

# ---------------------------------------------------------------
# Adaptateurs simulés
# ---------------------------------------------------------------
# SMS : les numéros listés ici simulent un échec d'envoi (séparés par des virgules)
sunuagri.sms.simulation.numeros-en-echec=+221770000000
# Prix du marché : service externe simulé (prix en XOF/kg) ; disponible=false simule une panne
sunuagri.prix-marche.simulation.disponible=true
sunuagri.prix-marche.simulation.prix.ARACHIDE=350
sunuagri.prix-marche.simulation.prix.MIL=250
sunuagri.prix-marche.simulation.prix.RIZ=300
sunuagri.prix-marche.simulation.prix.MAIS=200
