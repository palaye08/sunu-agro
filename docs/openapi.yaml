          type: string
          format: uuid
        producteurId:
          type: string
          format: uuid
        culture:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        quantiteKg:
          type: integer
          format: int64
        montant:
          type: integer
          format: int64
        devise:
          type: string
        statut:
          type: string
          enum:
          - A_PAYER
        dateCreation:
          type: string
          format: date-time
        notificationSms:
          $ref: "#/components/schemas/NotificationSms"
    PrixMarche:
      type: object
      properties:
