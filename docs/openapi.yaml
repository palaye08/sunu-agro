openapi: 3.0.1
info:
  title: SunuAgri API
  description: |
    API de la coopérative agricole SunuAgri : producteurs, parcelles, campagnes, cultures,
    récoltes, stock, offres, commandes et paiements dus.

    **Identité simulée** : renseignez les en-têtes `X-Role` et `X-Utilisateur-Id`
    via le bouton *Authorize*.

    **Erreurs** : toutes les erreurs suivent le format unique `Erreur`
    (RFC 9457, `application/problem+json`) avec un `code` stable.

    **Évolution** : l'API est versionnée dans le chemin (`/api/v1`) ; les évolutions
    compatibles (ajout de champs, de ressources) se font sans changer de version.
  contact:
    name: Coopérative SunuAgri
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- role: []
  utilisateur: []
tags:
- name: Producteurs
  description: "US-01, US-03, US-15"
- name: Parcelles
  description: "US-02, US-03"
- name: Campagnes
  description: US-04
- name: Cultures
  description: "US-05, US-06, US-07"
- name: Stock
  description: "US-08, US-09"
- name: Offres
  description: "US-10, US-18"
- name: Commandes
  description: "US-11, US-12, US-13, US-16"
- name: Paiements
  description: "US-13, US-14"
- name: Référentiel
  description: "US-18, US-19"
paths:
  /api/v1/parametres-cultures/{culture}:
    get:
      tags:
      - Référentiel
      summary: Consulter les paramètres d'une culture (US-19)
      description: "Rôle : ADMINISTRATEUR."
      operationId: consulter
      parameters:
      - name: culture
        in: path
        required: true
        schema:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "200":
          description: Paramètres en vigueur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParametresCulture"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
    put:
      tags:
      - Référentiel
      summary: Modifier les paramètres d'une culture (US-19)
      description: "Rôle : ADMINISTRATEUR. La modification s'applique aux déclarations\
        \ futures, jamais aux cultures déjà déclarées. Les valeurs doivent être strictement\
        \ positives."
      operationId: modifier
      parameters:
      - name: culture
        in: path
        required: true
        schema:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModificationParametresCulture"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "200":
          description: Paramètres modifiés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParametresCulture"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/producteurs:
    post:
      tags:
      - Producteurs
      summary: Enregistrer un producteur (US-01)
      description: "Rôle : AGENT. Le téléphone identifie le producteur et doit être\
        \ unique dans la coopérative."
      operationId: enregistrer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnregistrementProducteur"
        required: true
      responses:
        "409":
          $ref: "#/components/responses/Conflit"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "201":
          description: Producteur enregistré ; l'en-tête Location donne son adresse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producteur"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/producteurs/{producteurId}/parcelles:
    get:
      tags:
      - Parcelles
      summary: Lister les parcelles d'un producteur (US-03)
      description: "Rôles : AGENT, ou PRODUCTEUR pour ses propres parcelles."
      operationId: lister
      parameters:
      - name: producteurId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Parcelles du producteur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parcelle"
        "404":
          $ref: "#/components/responses/Introuvable"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
    post:
      tags:
      - Parcelles
      summary: Déclarer une parcelle d'un producteur (US-02)
      description: "Rôle : AGENT. Superficie strictement positive ; noms de parcelles\
        \ distincts pour un même producteur ; superficie totale du producteur plafonné\
        e (50 ha par défaut)."
      operationId: declarer
      parameters:
      - name: producteurId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclarationParcelle"
        required: true
      responses:
        "201":
          description: Parcelle déclarée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcelle"
        "404":
          $ref: "#/components/responses/Introuvable"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/producteurs/imports:
    post:
      tags:
      - Producteurs
      summary: Importer des producteurs depuis un fichier CSV (US-15)
      description: |-
        Rôle : AGENT. Fichier UTF-8, une ligne par producteur : `nom;prénom;téléphone;village`.
        Une ligne d'en-tête commençant par « nom » est ignorée. Les mêmes règles que l'enregistrement
        unitaire s'appliquent : les lignes valides sont enregistrées, les lignes invalides sont rapportées
        avec leur numéro et leur motif.
      operationId: importer
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - fichier
              type: object
              properties:
                fichier:
                  type: string
                  format: binary
      responses:
        "200":
          description: Compte rendu de l'import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RapportImport"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/offres:
    get:
      tags:
      - Offres
      summary: Lister les offres
      description: "Rôles : ACHETEUR (offres ouvertes uniquement) ou AGENT (toutes,\
        \ filtre de statut facultatif)."
      operationId: lister_1
      parameters:
      - name: statut
        in: query
        description: Filtre facultatif (ignoré pour un acheteur)
        required: false
        schema:
          type: string
          enum:
          - OUVERTE
          - EPUISEE
          - RETIREE
      responses:
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "200":
          description: "Offres, de la plus récente à la plus ancienne"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offre"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
    post:
      tags:
      - Offres
      summary: "Publier une offre de vente (US-10, US-18)"
      description: |-
        Rôle : AGENT. La quantité ne dépasse pas le stock disponible de la culture et de la qualité ;
        le prix au kg (XOF) est strictement positif. L'offre publiée réserve sa quantité dans le stock.
        Si le prix s'écarte de plus de 30 % du prix de référence du marché, l'offre est publiée avec
        un avertissement (champ `avertissementPrix`), sans être refusée.
      operationId: publier
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationOffre"
        required: true
      responses:
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "201":
          description: Offre publiée (statut OUVERTE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offre"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/offres/{offreId}/retrait:
    post:
      tags:
      - Offres
      summary: Retirer une offre (US-10)
      description: "Rôle : AGENT. La quantité non vendue est libérée ; les commandes\
        \ en attente restent honorées."
      operationId: retirer
      parameters:
      - name: offreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "200":
          description: Offre retirée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offre"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/cultures:
    post:
      tags:
      - Cultures
      summary: Déclarer une culture sur une parcelle pour une campagne (US-05)
      description: "Rôle : AGENT. La campagne doit être ouverte ; la culture fait\
        \ partie de la liste de référence ; la somme des superficies emblavées de\
        \ la parcelle pour la campagne ne dépasse pas sa superficie. Statut initial\
        \ : PLANIFIEE."
      operationId: declarer_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclarationCulture"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "201":
          description: Culture déclarée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Culture"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/cultures/{cultureId}/semis:
    post:
      tags:
      - Cultures
      summary: Enregistrer le semis d'une culture (US-06)
      description: "Rôle : AGENT. PLANIFIEE → SEMEE. Aucun retour en arrière."
      operationId: semer
      parameters:
      - name: cultureId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Semis"
        required: true
      responses:
        "200":
          description: Culture semée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Culture"
        "404":
          $ref: "#/components/responses/Introuvable"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/cultures/{cultureId}/recolte:
    post:
      tags:
      - Cultures
      summary: "Déclarer la récolte d'une culture (US-06, US-07)"
      description: |-
        Rôle : AGENT. SEMEE → RECOLTEE, une seule fois. La campagne doit être ouverte ; la quantité est
        strictement positive ; la date de récolte est au moins « cycle minimal » jours après le semis ;
        un rendement supérieur à deux fois le rendement de référence est refusé comme suspect.
      operationId: recolter
      parameters:
      - name: cultureId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Recolte"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "200":
          description: Récolte enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Culture"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/cultures/{cultureId}/livraisons:
    post:
      tags:
      - Stock
      summary: Livrer une récolte à l'entrepôt (US-08)
      description: |-
        Rôle : AGENT. La culture doit être récoltée ; le cumul livré ne dépasse pas la quantité récoltée ;
        l'humidité ne dépasse pas le seuil de la culture. Une livraison acceptée crée un lot identifiable,
        rattaché au producteur et daté. Une livraison refusée ne modifie rien.
      operationId: livrer
      parameters:
      - name: cultureId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LivraisonEntrepot"
        required: true
      responses:
        "201":
          description: "Livraison acceptée : lot créé"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "404":
          $ref: "#/components/responses/Introuvable"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/commandes:
    get:
      tags:
      - Commandes
      summary: Consulter l'historique des commandes (US-16)
      description: "Rôles : ACHETEUR (ses propres commandes uniquement) ou AGENT (toutes).\
        \ Paginé, de la plus récente à la plus ancienne, filtre de statut facultatif."
      operationId: historique
      parameters:
      - name: statut
        in: query
        required: false
        schema:
          type: string
          enum:
          - EN_ATTENTE
          - LIVREE
          - ANNULEE
      - name: page
        in: query
        description: "Numéro de page, à partir de 0"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: taille
        in: query
        description: Taille de page (1 à 100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "200":
          description: Une page de commandes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCommandes"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
    post:
      tags:
      - Commandes
      summary: Passer une commande sur une offre ouverte (US-11)
      description: |-
        Rôle : ACHETEUR. Quantité minimale 50 kg ; la quantité ne dépasse pas le restant de l'offre.
        Montant = quantité × prix au kg. Statut initial EN_ATTENTE ; l'offre devient EPUISEE
        quand plus rien ne reste.
      operationId: passer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassageCommande"
        required: true
      responses:
        "201":
          description: Commande créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commande"
        "404":
          $ref: "#/components/responses/Introuvable"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/commandes/{commandeId}/livraison:
    post:
      tags:
      - Commandes
      summary: "Confirmer la livraison d'une commande et répartir le paiement (US-13,\
        \ US-14)"
      description: |-
        Rôle : AGENT. Seule une commande EN_ATTENTE peut être livrée. Les lots de la culture et de la qualité
        sont consommés du plus ancien au plus récent. La coopérative retient sa commission (5 %), le reste
        est réparti entre les producteurs au prorata des quantités apportées dans les lots consommés
        (arrondi au franc par la méthode du plus fort reste : commission + paiements = montant, exactement).
        Chaque paiement dû est créé « à payer » et un SMS est envoyé au producteur ; un échec d'envoi
        n'annule pas la livraison et est tracé dans `notificationSms`.
      operationId: livrer_1
      parameters:
      - name: commandeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "200":
          description: "Commande livrée, paiements dus enregistrés"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivraisonCommande"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/commandes/{commandeId}/annulation:
    post:
      tags:
      - Commandes
      summary: Annuler sa commande (US-12)
      description: "Rôle : ACHETEUR, propriétaire de la commande. Possible tant que\
        \ la commande n'est pas livrée ; la quantité annulée redevient disponible\
        \ dans l'offre."
      operationId: annuler
      parameters:
      - name: commandeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "200":
          description: Commande annulée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commande"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/campagnes:
    get:
      tags:
      - Campagnes
      summary: Lister les campagnes
      description: "Rôle : AGENT. De la plus récente à la plus ancienne."
      operationId: lister_2
      responses:
        "200":
          description: Campagnes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campagne"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
    post:
      tags:
      - Campagnes
      summary: Ouvrir une campagne agricole (US-04)
      description: "Rôle : AGENT. Saison HIVERNAGE ou CONTRE_SAISON ; date de fin\
        \ postérieure à la date de début ; une seule campagne par saison et par anné\
        e."
      operationId: ouvrir
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OuvertureCampagne"
        required: true
      responses:
        "409":
          $ref: "#/components/responses/Conflit"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "201":
          description: Campagne ouverte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campagne"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/campagnes/{campagneId}/cloture:
    post:
      tags:
      - Campagnes
      summary: Clôturer une campagne (US-04)
      description: "Rôle : AGENT. Une campagne clôturée n'accepte plus de nouvelle\
        \ culture ni de récolte."
      operationId: cloturer
      parameters:
      - name: campagneId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          $ref: "#/components/responses/Introuvable"
        "403":
          $ref: "#/components/responses/AccesRefuse"
        "422":
          $ref: "#/components/responses/RegleMetier"
        "200":
          description: Campagne clôturée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campagne"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /api/v1/stocks:
    get:
      tags:
      - Stock
      summary: Consulter le stock par culture et par qualité (US-09)
