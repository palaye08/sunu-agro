components:
  schemas:
    ModificationParametresCulture:
      required:
      - cycleMinimalJours
      - humiditeMaxPourcent
      - rendementReferenceKgParHa
      type: object
      properties:
        rendementReferenceKgParHa:
          type: number
          example: 1200
        humiditeMaxPourcent:
          type: number
          example: 9
        cycleMinimalJours:
          type: integer
          format: int32
          example: 90
    ParametresCulture:
      type: object
      properties:
        culture:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        rendementReferenceKgParHa:
          type: number
        humiditeMaxPourcent:
          type: number
        cycleMinimalJours:
          type: integer
          format: int32
    EnregistrementProducteur:
      required:
      - nom
      - prenom
      - telephone
      - village
      type: object
      properties:
        nom:
          maxLength: 100
          minLength: 0
          type: string
          example: Diop
        prenom:
          maxLength: 100
          minLength: 0
          type: string
          example: Awa
        telephone:
          type: string
          description: "Numéro sénégalais (9 chiffres, +221 facultatif)"
          example: "+221771234567"
        village:
          maxLength: 100
          minLength: 0
          type: string
          example: Ndiaganiao
    Producteur:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        prenom:
          type: string
        telephone:
          type: string
        village:
          type: string
    DeclarationParcelle:
      required:
      - commune
      - nom
      - superficieHa
      type: object
      properties:
        nom:
          maxLength: 100
          minLength: 0
          type: string
          example: Champ du baobab
        superficieHa:
          type: number
          description: "Superficie en hectares, strictement positive"
          example: 3.5
        commune:
          maxLength: 100
          minLength: 0
          type: string
          example: Fatick
    Parcelle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        producteurId:
          type: string
          format: uuid
        nom:
          type: string
        superficieHa:
          type: number
        commune:
          type: string
    LigneRefusee:
      type: object
      properties:
        ligne:
          type: integer
          format: int32
        motif:
          type: string
    RapportImport:
      type: object
      properties:
        lignesTraitees:
          type: integer
          format: int32
        lignesAcceptees:
          type: integer
          format: int32
        lignesRefusees:
          type: integer
          format: int32
        producteursCrees:
          type: array
          items:
            type: string
            format: uuid
        refus:
          type: array
          items:
            $ref: "#/components/schemas/LigneRefusee"
    PublicationOffre:
      required:
      - culture
      - prixParKg
      - qualite
      - quantiteKg
      type: object
      properties:
        culture:
          type: string
          example: ARACHIDE
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        qualite:
          type: string
          example: A
          enum:
          - A
          - B
          - C
        quantiteKg:
          type: integer
          description: Quantité en kg
          format: int64
          example: 1000
        prixParKg:
          type: integer
          description: Prix au kg en XOF
          format: int64
          example: 350
    Offre:
      type: object
      properties:
        id:
          type: string
          format: uuid
        culture:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        qualite:
          type: string
          enum:
          - A
          - B
          - C
        quantiteKg:
          type: integer
          format: int64
        quantiteRestanteKg:
          type: integer
          format: int64
        prixParKg:
          type: integer
          format: int64
        devise:
          type: string
        statut:
          type: string
          enum:
          - OUVERTE
          - EPUISEE
          - RETIREE
        datePublication:
          type: string
          format: date-time
        avertissementPrix:
          type: string
          description: Présent si le prix s'écarte de plus de 30 % du prix de référence
            (US-18)
    DeclarationCulture:
      required:
      - campagneId
      - culture
      - parcelleId
      - superficieEmblaveeHa
      type: object
      properties:
        parcelleId:
          type: string
          format: uuid
        campagneId:
          type: string
          format: uuid
        culture:
          type: string
          example: ARACHIDE
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        superficieEmblaveeHa:
          type: number
          description: Superficie emblavée en hectares
          example: 2
    Culture:
      type: object
      properties:
        id:
          type: string
          format: uuid
        producteurId:
          type: string
          format: uuid
        parcelleId:
          type: string
          format: uuid
        campagneId:
          type: string
          format: uuid
        culture:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        superficieEmblaveeHa:
          type: number
        statut:
          type: string
          enum:
          - PLANIFIEE
          - SEMEE
          - RECOLTEE
        dateSemis:
          type: string
          format: date
        dateRecolte:
          type: string
          format: date
        quantiteRecolteeKg:
          type: integer
          format: int64
        rendementKgParHa:
          type: number
        quantiteLivreeKg:
          type: integer
          format: int64
    Semis:
      required:
      - dateSemis
      type: object
      properties:
        dateSemis:
          type: string
          format: date
          example: 2026-07-01
    Recolte:
      required:
      - dateRecolte
      - quantiteKg
      type: object
      properties:
        dateRecolte:
          type: string
          format: date
          example: 2026-10-15
        quantiteKg:
          type: integer
          description: Quantité récoltée en kg
          format: int64
          example: 2000
    LivraisonEntrepot:
      required:
      - qualite
      - quantiteKg
      - tauxHumidite
      type: object
      properties:
        quantiteKg:
          type: integer
          description: Quantité livrée en kg
          format: int64
          example: 1500
        tauxHumidite:
          type: number
          description: Taux d'humidité en %
          example: 8.5
        qualite:
          type: string
          example: A
          enum:
          - A
          - B
          - C
    Lot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        producteurId:
          type: string
          format: uuid
        cultureId:
          type: string
          format: uuid
        culture:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        qualite:
          type: string
          enum:
          - A
          - B
          - C
        quantiteKg:
          type: integer
          format: int64
        quantiteRestanteKg:
          type: integer
          format: int64
        tauxHumidite:
          type: number
        dateReception:
          type: string
          format: date-time
    PassageCommande:
      required:
      - offreId
      - quantiteKg
      type: object
      properties:
        offreId:
          type: string
          format: uuid
        quantiteKg:
          type: integer
          description: Quantité en kg
          format: int64
          example: 600
    Commande:
      type: object
      properties:
        id:
          type: string
          format: uuid
        offreId:
          type: string
          format: uuid
        acheteurId:
          type: string
        culture:
          type: string
          enum:
          - ARACHIDE
          - MIL
          - RIZ
          - MAIS
        qualite:
          type: string
          enum:
          - A
          - B
          - C
        quantiteKg:
          type: integer
          format: int64
        prixParKg:
          type: integer
          format: int64
        montant:
          type: integer
          format: int64
        devise:
          type: string
        statut:
          type: string
          enum:
          - EN_ATTENTE
          - LIVREE
          - ANNULEE
        dateCreation:
          type: string
          format: date-time
        dateLivraison:
          type: string
          format: date-time
    LivraisonCommande:
      type: object
      properties:
        commande:
          $ref: "#/components/schemas/Commande"
        montantCommande:
          type: integer
          format: int64
        commissionCooperative:
          type: integer
          format: int64
        totalVerseProducteurs:
          type: integer
          format: int64
        lotsConsommes:
          type: array
          items:
            $ref: "#/components/schemas/LotConsomme"
        paiements:
          type: array
          items:
            $ref: "#/components/schemas/PaiementDuResume"
    LotConsomme:
      type: object
