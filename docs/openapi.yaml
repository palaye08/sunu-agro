        dateFin:
          type: string
          format: date
          example: 2026-12-31
    Campagne:
      type: object
      properties:
        id:
          type: string
          format: uuid
        saison:
          type: string
          enum:
          - HIVERNAGE
          - CONTRE_SAISON
        annee:
          type: integer
          format: int32
        dateDebut:
          type: string
          format: date
        dateFin:
          type: string
          format: date
        statut:
          type: string
          enum:
          - OUVERTE
          - CLOTUREE
    EtatStock:
      type: object
      properties:
        culture:
          type: string
