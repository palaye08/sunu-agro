    PaiementDuResume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        producteurId:
          type: string
          format: uuid
        quantiteKg:
          type: integer
          format: int64
        montant:
          type: integer
          format: int64
        statut:
          type: string
